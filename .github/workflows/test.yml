name: Test

permissions:
  contents: read

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      # Without this a failure on one platform cancels the others, and the run reports the
      # first thing that broke rather than everything that is broken.
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]
        # Linux is what the image runs on, macOS is what the team writes on. Windows was
        # dropped: it only ever reported that our own scripts used shell syntax, which is
        # a problem created by testing there rather than one found by it. `cross-env` in
        # package.json keeps those scripts working for anyone who does open the repository
        # on Windows, but nothing here proves it.
        os: [ubuntu-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The server reads dist/index.html at run time, and only the favicon of that folder
      # is committed. Without this the tests that ask for a page fail on a missing file.
      - run: npm run build:pre

      - run: npm test

      # The role tests need the role set from outside: the server reads it when the module
      # is imported, before any statement in the test file runs. Without this step they
      # would pass against the single-process setup and prove nothing.
      - run: npm run test:roles

  coverage:
    name: 'Coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ClickHouse runs here as well as in the parity job. Without it a third of the storage
    # code cannot be reached, and the coverage number would be a statement about the
    # environment rather than about the tests.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: ackee
          CLICKHOUSE_USER: ackee
          CLICKHOUSE_PASSWORD: ackee

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run build:pre

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/ping >/dev/null && exit 0
            sleep 2
          done
          echo "ClickHouse did not start"; exit 1

      # The thresholds live in .c8rc.json and sit a little below the measured value, so a
      # failure means a real regression rather than noise.
      - run: npm run test:coverage
        env:
          ACKEE_CLICKHOUSE: http://127.0.0.1:8123
          ACKEE_CLICKHOUSE_USER: ackee
          ACKEE_CLICKHOUSE_PASSWORD: ackee

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  clickhouse:
    name: 'ClickHouse parity'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The parity tests skip themselves when ClickHouse is not configured, so without this
    # job they would quietly never run — and they are the ones that prove both read paths
    # return the same numbers. Redis is here for the ingest queue suite, which the same
    # command runs.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: ackee
          CLICKHOUSE_USER: ackee
          CLICKHOUSE_PASSWORD: ackee
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/ping >/dev/null && exit 0
            sleep 2
          done
          echo "ClickHouse did not start"; exit 1

      - run: npm run test:ch
        env:
          ACKEE_CLICKHOUSE: http://127.0.0.1:8123
          ACKEE_CLICKHOUSE_USER: ackee
          ACKEE_CLICKHOUSE_PASSWORD: ackee
          ACKEE_REDIS_URL: redis://127.0.0.1:6379

  audit:
    name: 'Dependency audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # A high finding in something that ships is a build failure. The same finding in a
      # build tool is worth knowing about but does not stop a release, so it only reports.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker:
    name: 'Docker image'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built but not published: this job answers whether the image still works, and
      # release.yml answers where it goes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ackee:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that starts is not the same as an instance somebody can use. This
      # registers an account through the image, which is the first thing a new instance
      # has to be able to do since ACKEE_USERNAME was removed.
      - name: Image starts and accepts a first account
        run: |
          docker network create ackee-ci
          docker run -d --name mongo --network ackee-ci mongo:7
          docker run -d --name ackee --network ackee-ci -p 3000:3000 \
            -e ACKEE_MONGODB=mongodb://mongo:27017/ackee \
            ackee:ci

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
            if [ "$i" = "30" ]; then echo "Container did not start"; docker logs ackee; exit 1; fi
          done

          body=$(curl -sf http://127.0.0.1:3000/api \
            -H 'Content-Type: application/json' \
            -d '{"query":"mutation { createUser(input: {email: \"ci@example.com\", password: \"ci-password-long\"}) { success } }"}')

          echo "$body"
          echo "$body" | grep -q '"success":true' || { docker logs ackee; exit 1; }
