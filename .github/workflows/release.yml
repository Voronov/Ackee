name: Release

# What happens when a version is tagged: one image, built once, published under the tags
# that let someone pin as tightly or as loosely as they want.

on:
  push:
    tags: ['v*']
  # Lets a failed publish be repeated without moving the tag, which would change what a
  # released version means.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v4.0.1'
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # A release is not the place to find out the tests fail. The tag is built only after the
  # same checks the branch had to pass.
  verify:
    name: 'Verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run test:roles

      # A tag that says 4.0.1 and a package.json that says something else is the kind of
      # mistake nobody notices until someone reports a bug against the wrong version.
      - name: Tag matches the version in package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "$tag matches package.json"

  image:
    name: 'Publish image'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      # Needed to sign the build provenance, which is what lets someone verify the image
      # was built here and not somewhere else.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # arm64 as well as amd64: the cheap servers people put this on are increasingly arm,
      # and an image that only runs on one of them is half an image.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: 'Create release'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The release notes are the CHANGELOG entry for this version. Writing them twice is
      # how the two end up saying different things.
      - name: Take the notes from the CHANGELOG
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The heading is "## [4.0.1] - 2026-09-22", so the version is matched with the
          # brackets it is written in rather than on its own.
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?([ -]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry for $version" > notes.md
          fi

          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
