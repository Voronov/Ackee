name: CodeQL

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    # A weekly run catches a vulnerability that was announced after the merge. Without it
    # the code is only ever checked on the day it changes.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 'Analyze JavaScript'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
