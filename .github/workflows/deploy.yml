name: Deploy

# Deployment is a separate workflow and never automatic. A published image is a fact; a
# deployed image is a decision, and somebody makes it by starting this.
#
# Only an account with write access can start it, and the `production` environment can add
# a reviewer on top of that. Neither is the real protection: anyone who can push can also
# change a workflow to print a secret. The protection is that the key on the other end is
# pinned to one command and can do nothing else, whoever holds it.
#
# Secrets, under the `production` environment:
#   DEPLOY_HOST  address of the server
#   DEPLOY_USER  user to connect as
#   DEPLOY_KEY   private half of the key that user accepts
# Variable:
#   DEPLOY_URL   address to check once the containers are back

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy, for example 4.0.1'
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    # Everything below reads its values from here. A `${{ }}` written straight into a shell
    # line is pasted into the script before the shell sees it, so an input holding a quote
    # stops being an argument and starts being code.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Refuse to start without the secrets
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          missing=''
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$DEPLOY_KEY" ] && missing="$missing DEPLOY_KEY"
          if [ -n "$missing" ]; then
            echo "Missing secrets:$missing"
            echo "See the comment at the top of this workflow."
            exit 1
          fi
          echo "Deploying $TAG"

      - name: Load the key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # The host key is recorded rather than accepted blindly, so a changed host stops
          # the deploy instead of being trusted.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The tag is the whole message. The key is pinned to a script on the server, which
      # reads the tag, checks its shape and runs compose itself. This workflow cannot ask
      # the server for anything else, and neither can anyone who steals the key.
      - name: Deploy
        run: ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "$TAG"

      - name: Check it answers
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL is not set, skipping the check"
            exit 0
          fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL")
            [ "$code" = "200" ] && { echo "$DEPLOY_URL answers $code"; exit 0; }
            sleep 5
          done
          echo "$DEPLOY_URL did not come back"; exit 1

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
