"""
Domains are required to track views. You can create as many domains as you want, but it's recommended to create on domain per project/site. This allows you to view facts and statistics separately.
"""
type Domain {
  """
  Whether the viewer may turn collectCountry on or off. Only an owner may.
  """
  canManageCountry: Boolean!

  """
  Whether views carry the country of the visitor, read from their address on the server.
  Needs ACKEE_GEO on the instance. Only the two-letter code is stored, never the address.
  """
  collectCountry: Boolean

  """Identifies the date and time when the object was created."""
  created: DateTime!

  """
  Facts about a domain. Usually simple data that can be represented in one value.
  """
  facts(filters: [FilterInput!], source: StatisticsSource = ACKEE): Facts!
  ga4: Ga4Connection

  """Domain identifier."""
  id: ID!

  """
  Key the tracker sends alongside the domain id. Visible to anyone who opens the tracked
  page, so it is a hurdle rather than a secret. Rotate it if it is being misused.
  """
  ingestKey: String

  """
  Statistics of a domain. Usually data that needs to be represented in a list or chart.
  """
  statistics(filters: [FilterInput!], period: PeriodInput, source: StatisticsSource = ACKEE): DomainStatistics!

  """
  While this is off, events are accepted with or without a key, so an existing snippet
  keeps working. Turn it on once the snippet on your site carries the key.
  """
  strictIngest: Boolean

  """Title of the domain."""
  title: String!
  tracking: DomainTracking!

  """Identifies the date and time when the object was updated."""
  updated: DateTime!
}

"""
Statistics of a domain. Usually data that needs to be represented in a list or chart.
"""
type DomainStatistics {
  """Browsers used by your visitors."""
  browsers(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
    type: BrowserType!
  ): [Browser!]

  """
  Countries your visitors come from, when the domain collects them (ACKEE-100).
  """
  countries(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
  ): [Country!]

  """Devices used by your visitors."""
  devices(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
    type: DeviceType!
  ): [Device!]

  """Average visit duration by day, month or year."""
  durations(
    interval: Interval!

    """
    Number of entries to return. Starts with the current day, month or year depending on the chosen interval.
    """
    limit: Int = 14
  ): [Duration!]

  """Statistic identifier."""
  id: ID!

  """Browser languages used by your visitors."""
  languages(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
  ): [Language!]

  """Pages viewed by your visitors."""
  pages(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
  ): [Page!]

  """Where your visitors are coming from."""
  referrers(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
    type: ReferrerType!
  ): [Referrer!]

  """Screen or browser sizes used by your visitors."""
  sizes(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
    type: SizeType!
  ): [Size!]

  """Systems used by your visitors."""
  systems(
    """Number of entries to return."""
    limit: Int = 30
    range: Range = LAST_7_DAYS
    sorting: Sorting!
    type: SystemType!
  ): [System!]

  """Amount of views grouped by day, month or year."""
  views(
    interval: Interval!

    """
    Number of entries to return. Starts with the current day, month or year depending on the chosen interval.
    """
    limit: Int = 14
    type: ViewType!
  ): [View!]
}

"""What the site collects besides page views, served to it by /t/<id>.js."""
type DomainTracking {
  downloadExtensions: [String!]!
