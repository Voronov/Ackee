  """
  Either the URL of the referrer or the source parameter of the page to indicate where the visit comes from.
  """
  value: String!
}

enum ReferrerType {
  """Omit source parameters and show referrers only."""
  NO_SOURCE

  """Omit referrers and show source parameters only."""
