type Query {
  """
  Recent changes in the workspaces where the viewer may read the audit log. Newest first.
  """
  auditLog(limit: Int = 50): [AuditEntry!]!

  """
  What is running here. Readable without a token, so a deploy can check a stand.
  """
  build: Build!

  """Whether this instance can tell the country of a visitor (ACKEE_GEO)."""
  countryAvailable: Boolean!

  """Data of a specific domain."""
  domain(id: ID!): Domain

  """Data of all existing domains."""
  domains: [Domain!]

  """Data of a specific event."""
  event(id: ID!): Event

  """Data of all existing events."""
  events: [Event!]

  """
  Facts of all domains combined, or of the one given. Usually simple data that can be represented in one value.
  """
  facts(domainId: ID, filters: [FilterInput!], source: StatisticsSource = ACKEE): Facts!

  """Whether this instance can keep GA4 keys: ACKEE_SECRET_KEY is set."""
  ga4Available: Boolean!

  """The viewer's passkeys."""
  passkeys: [Passkey!]!

  """Data of a specific permanent token."""
  permanentToken(id: ID!): PermanentToken

  """Data of all existing permanent tokens."""
  permanentTokens: [PermanentToken!]

  """
  Ways to sign in besides a password. Readable without a token, like signup.
  """
  signInOptions: SignInOptions!

  """
  Whether registration is currently possible. Readable without a token, because
  the sign-in screen needs it before anyone has signed in.
  """
  signup: Signup!

  """
  Statistics of all domains combined, or of the one given. Usually data that needs to be represented in a list or chart.
  """
  statistics(domainId: ID, filters: [FilterInput!], period: PeriodInput, source: StatisticsSource = ACKEE): DomainStatistics!

  """The user behind the current token."""
  viewer: User

  """The workspaces the viewer belongs to."""
  workspaces: [Workspace!]!
}

enum Range {
  """Data of the last 6 months."""
  LAST_6_MONTHS

  """Data of the last 7 days."""
  LAST_7_DAYS

  """Data of the last 24 hours."""
  LAST_24_HOURS

  """Data of the last 30 days."""
  LAST_30_DAYS
