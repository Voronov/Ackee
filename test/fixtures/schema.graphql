type Mutation {
  """Adds a passkey from the browser's answer."""
  addPasskey(input: AddPasskeyInput!): AddPasskeyPayload!

  """Links a domain to a GA4 property and starts the first sync."""
  connectGa4(domainId: ID!, input: ConnectGa4Input!): ConnectGa4Payload!

  """Create a new action to track an event."""
  createAction(eventId: ID!, input: CreateActionInput!): CreateActionPayload!

  """Create a new domain."""
  createDomain(input: CreateDomainInput!): CreateDomainPayload!

  """Create a new event."""
  createEvent(input: CreateEventInput!): CreateEventPayload!

  """
  Create a new permanent token. The token is required in order to access protected data.
  """
  createPermanentToken(input: CreatePermanentTokenInput!): CreatePermanentTokenPayload!

  """Create a new record to track a page visit."""
  createRecord(domainId: ID!, input: CreateRecordInput!): CreateRecordPayload!

  """
  Create a new token. The token is required in order to access protected data.
  """
  createToken(input: CreateTokenInput!): CreateTokenPayload!

  """
  Signs in with the browser's answer to the sign-in options and returns a token, like createToken.
  """
  createTokenWithPasskey(response: String!): CreateTokenPayload!

  """
  Creates an account together with its personal workspace. Governed by ACKEE_ALLOW_SIGNUP.
  """
  createUser(input: CreateUserInput!): CreateUserPayload!

  """Delete an existing domain."""
  deleteDomain(id: ID!): DeleteDomainPayload!

  """Delete an existing event."""
  deleteEvent(id: ID!): DeleteEventPayload!

  """Removes one of the viewer's passkeys."""
  deletePasskey(id: ID!): Success!

  """
  Delete an existing permanent token. The token than can't be used anymore for authentication.
  """
  deletePermanentToken(id: ID!): DeletePermanentTokenPayload!

  """
  Delete an existing token. The token than can't be used anymore for authentication.
  """
  deleteToken(id: ID!): DeleteTokenPayload!

  """Unlinks the property and deletes the days synced from it."""
  disconnectGa4(domainId: ID!): Success!

  """
  Emails a one-time link that lets the address join the workspace. Needs MEMBERS_MANAGE there.
  """
  inviteMember(input: InviteMemberInput!): InviteMemberPayload!

  """
  Options for navigator.credentials.create, as JSON. For a signed-in viewer only.
  """
  passkeyRegistrationOptions: String!

  """
  Options for navigator.credentials.get, as JSON. Needs no token: it starts a sign-in.
  """
  passkeySignInOptions: String!

  """Removes a member from the workspace. The last owner cannot be removed."""
  removeMember(id: ID!): Success!

  """Starts a password reset. Always reports success, for the same reason."""
  requestPasswordReset(email: String!): Success!

  """
  Sends the confirmation email again. Always reports success, so that it cannot be used
  to find out which addresses have an account.
  """
  resendVerification(email: String!): Success!

  """Sets a new password using the token from the email."""
  resetPassword(input: ResetPasswordInput!): Success!

  """Stops a pending invitation from being accepted."""
  revokeInvitation(id: ID!): Success!

  """Issues a new ingest key and invalidates the old one."""
  rotateIngestKey(id: ID!): UpdateDomainPayload!

  """Syncs the property now instead of waiting for the next run."""
  syncGa4(domainId: ID!): ConnectGa4Payload!

  """Update an existing action."""
  updateAction(id: ID!, input: UpdateActionInput!): UpdateActionPayload!

  """Update an existing domain."""
  updateDomain(id: ID!, input: UpdateDomainInput!): UpdateDomainPayload!

  """
  Replaces what the site collects. Creates the events that hold it on first use.
  """
  updateDomainTracking(id: ID!, input: DomainTrackingInput!): UpdateDomainTrackingPayload!

  """Update an existing event."""
  updateEvent(id: ID!, input: UpdateEventInput!): UpdateEventPayload!

  """Update an existing permanent token."""
  updatePermanentToken(id: ID!, input: UpdatePermanentTokenInput!): UpdatePermanentTokenPayload!

  """Update an existing record to track the duration of a visit."""
  updateRecord(id: ID!): UpdateRecordPayload!

  """Confirms an address with the token from the email."""
  verifyUser(token: String!): Success!
}

