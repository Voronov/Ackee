  """The Ackee events that hold what was collected, one per kind."""
  events: TrackingEvents!

  """
  A Google Tag Manager container the site loads, like GTM-ABC1234. Empty for none.
  """
  gtmId: String!
  outbound: Boolean!
  rules: [TrackingRule!]!
  scroll: Boolean!
  vitals: Boolean!
}

input DomainTrackingInput {
  downloadExtensions: [String!]
  downloads: Boolean
  gtmId: String
  outbound: Boolean
  rules: [TrackingRuleInput!]
  scroll: Boolean
  vitals: Boolean
}

type Duration {
  """Average duration in milliseconds."""
  count: UnsignedInt!

  """Duration identifier."""
  id: ID!

  """
  Date of average duration.
  Either YYYY, YYYY-MM or YYYY-MM-DD depending on the current interval.
  """
