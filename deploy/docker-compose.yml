# The server side of .github/workflows/deploy.yml. Lives in /opt/ackee next to .env.
#
#   ackee.varlex.app       upstream 3.6.1, the unchanged reference
#   ackee2.varlex.app      live: the last version tag
#   dev.ackee2.varlex.app  dev: the last merge into develop
#
# One MongoDB, one database per stand.

# Without limits the json logs grow until the disk is full. That is how mongo went down.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Mailbux. The values live in .env on the server, never in the repository. Each stand has
# its own mailbox, so mail from dev is easy to tell apart and its password opens nothing on live.
x-smtp-live: &smtp-live
  ACKEE_SMTP_HOST: ${ACKEE_SMTP_HOST}
  ACKEE_SMTP_PORT: ${ACKEE_SMTP_PORT}
  ACKEE_SMTP_USER: ${ACKEE_SMTP_USER}
  ACKEE_SMTP_PASSWORD: ${ACKEE_SMTP_PASSWORD}
  ACKEE_SMTP_FROM: ${ACKEE_SMTP_FROM}

x-smtp-dev: &smtp-dev
  ACKEE_SMTP_HOST: ${ACKEE_SMTP_HOST}
  ACKEE_SMTP_PORT: ${ACKEE_SMTP_PORT}
  ACKEE_SMTP_USER: ${ACKEE_DEV_SMTP_USER}
  ACKEE_SMTP_PASSWORD: ${ACKEE_DEV_SMTP_PASSWORD}
  ACKEE_SMTP_FROM: ${ACKEE_DEV_SMTP_FROM}

services:
  mongo:
    image: mongo:7
    container_name: ackee-mongo
    restart: unless-stopped
    # 3.7 GB on the server. By default WiredTiger takes half of it for the cache.
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.35']
    mem_limit: 768m
    volumes:
      - mongo-data:/data/db
    networks: [ackee]
    logging: *logging
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 10

  ackee-v1:
    image: electerious/ackee:3.6.1
    container_name: ackee-v1
    restart: unless-stopped
    environment:
      ACKEE_MONGODB: mongodb://mongo:27017/ackee_v1
      ACKEE_USERNAME: ${ACKEE_USERNAME}
      ACKEE_PASSWORD: ${ACKEE_PASSWORD}
      ACKEE_ALLOW_ORIGIN: https://ackee.varlex.app
      ACKEE_AUTO_ORIGIN: 'true'
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 640m
    networks: [ackee]
    logging: *logging

  ackee-live:
    # The tag is written by /usr/local/bin/ackee-deploy.
    image: ghcr.io/voronov/ackee:${ACKEE_LIVE_TAG:?set by ackee-deploy}
    container_name: ackee-live
    restart: unless-stopped
    environment:
      ACKEE_MONGODB: mongodb://mongo:27017/ackee_live
      ACKEE_USERNAME: ${ACKEE_USERNAME}
      ACKEE_PASSWORD: ${ACKEE_PASSWORD}
      ACKEE_ALLOW_ORIGIN: https://ackee2.varlex.app
      ACKEE_AUTO_ORIGIN: 'true'
      ACKEE_URL: https://ackee2.varlex.app
      <<: *smtp-live
      # Encrypts the Google Analytics keys kept in the database (ACKEE-21). Each stand has its own.
      ACKEE_SECRET_KEY: ${ACKEE_SECRET_KEY:-}
      # Prometheus reads /metrics with this token. Each stand has its own.
      ACKEE_METRICS_TOKEN: ${ACKEE_METRICS_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 640m
    networks: [ackee]
    logging: *logging

  ackee-dev:
    image: ghcr.io/voronov/ackee:${ACKEE_DEV_TAG:?set by ackee-deploy}
    container_name: ackee-dev
    restart: unless-stopped
    environment:
      ACKEE_MONGODB: mongodb://mongo:27017/ackee_dev
      ACKEE_USERNAME: ${ACKEE_USERNAME}
      ACKEE_PASSWORD: ${ACKEE_PASSWORD}
      ACKEE_ALLOW_ORIGIN: https://dev.ackee2.varlex.app
      ACKEE_AUTO_ORIGIN: 'true'
      ACKEE_URL: https://dev.ackee2.varlex.app
      # Open on dev so registration can be tried. Live stays closed until decided.
      ACKEE_ALLOW_SIGNUP: 'true'
      <<: *smtp-dev
      # Encrypts the Google Analytics keys kept in the database (ACKEE-21). Each stand has its own.
      ACKEE_SECRET_KEY: ${ACKEE_DEV_SECRET_KEY:-}
      # Prometheus reads /metrics with this token. Each stand has its own.
      ACKEE_METRICS_TOKEN: ${ACKEE_DEV_METRICS_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 512m
    networks: [ackee]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    container_name: ackee-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [ackee-v1, ackee-live, ackee-dev]
    mem_limit: 96m
    networks: [ackee]
    logging: *logging

networks:
  ackee:

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
  # Left from 4.0.1. Not mounted any more, kept until someone decides to drop it.
  clickhouse-data:
