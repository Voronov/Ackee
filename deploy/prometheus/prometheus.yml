# Mounted into the prometheus container. Each token sits in its own file next to this one
# (secrets/live, secrets/dev), copied from ACKEE_METRICS_TOKEN and ACKEE_DEV_METRICS_TOKEN in .env.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: ackee-live
    authorization:
      credentials_file: /etc/prometheus/secrets/live
    static_configs:
      - targets: ['ackee-live:3000']

  - job_name: ackee-dev
    authorization:
      credentials_file: /etc/prometheus/secrets/dev
    static_configs:
      - targets: ['ackee-dev:3000']
